<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth Buddy</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 300px; padding: 14px; }
    .item { padding: 10px 0; border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="head"><h2 style="margin:0">Auth Buddy</h2><button id="settings">Settings</button></div>
  <div id="locked" class="hidden">
    <input id="pin" type="password" placeholder="Your PIN" autocomplete="current-password">
    <div class="row" style="margin-top:8px"><button id="unlock" class="primary">Unlock</button></div>
    <p id="err" class="error"></p>
  </div>
  <div id="new" class="hidden"><p>Open Settings to choose a PIN and add your first account.</p></div>
  <div id="open" class="hidden">
    <div id="codes"></div>
    <p id="none" class="muted hidden"></p>
    <div class="row" style="margin-top:10px"><button id="lock">Lock</button></div>
  </div>
  <script type="module" src="src/popup.js"></script>
</body>
</html>
